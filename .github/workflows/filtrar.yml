name: Filtrar faces do Football Life 27

on:
  workflow_dispatch:
  push:
    paths:
      - 'faces.txt'
      - 'main.py'
      - '.github/workflows/filtrar.yml'

jobs:
  filtrar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar filtro gratuito pelo Wikidata
        run: python main.py

      - name: Disponibilizar resultados
        uses: actions/upload-artifact@v4
        with:
          name: jogadores-europa-americas-fl27
          path: |
            jogadores_europa_americas.txt
            pendentes_revisao.txt
            transfermarkt_conferencia.csv
            resumo.txt
